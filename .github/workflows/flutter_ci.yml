name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Verify Generated Code
      run: |
        dart run build_runner build --delete-conflicting-outputs
        git diff --exit-code -- '*.g.dart' '*.freezed.dart' '*.drift.dart' || (echo "Generated files are out of date. Run: dart run build_runner build --delete-conflicting-outputs" && exit 1)

    - name: Check Formatting
      run: dart format --set-exit-if-changed .

    - name: Analyze Code
      run: flutter analyze

    - name: Run Tests
      run: flutter test
